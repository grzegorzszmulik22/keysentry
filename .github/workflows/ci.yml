name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node tools/vitest-sandbox.mjs test/
      - run: npx tsc -p tsconfig.client.json --noEmit
      - run: npx tsc -p packages/control-plane/tsconfig.json --noEmit
      - run: node tools/vitest-sandbox.mjs packages/control-plane/test
      - run: npx tsc -p packages/control-plane/tsconfig.ui.json --noEmit
      - run: node packages/control-plane/scripts/build-ui.mjs --check

  images:
    name: Box and control-plane images build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Built locally only: nothing is pushed or deployed.
      - run: docker build -f Dockerfile.box -t keysentry-box:ci --build-arg KEYSENTRY_BUILD_COMMIT=${{ github.sha }} .
      - name: Box image keeps its launch policy, user and entry point
        run: |
          docker image inspect keysentry-box:ci --format '{{json .Config.Labels}} {{json .Config.Entrypoint}} {{.Config.User}} {{.Architecture}}' > box.txt
          grep -q '"tee.launch_policy.allow_cmd_override":"false"' box.txt
          grep -q '"tee.launch_policy.log_redirect":"debugonly"' box.txt
          grep -q '"tee.launch_policy.monitoring_memory_allow":"never"' box.txt
          ! grep -q allow_env_override box.txt
          grep -q '"box","agent"] 65532 amd64' box.txt
      - run: docker build -f Dockerfile.control-plane -t keysentry-control-plane:ci .

  release-build:
    name: Audit and reproducible release build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEYSENTRY_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run release:build
      - run: npm run release:check
      - name: Run the bundle inside the Node permission sandbox
        run: sh scripts/sandbox-smoke.sh dist-release/out/keysentry.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preview
          if-no-files-found: error
          path: |
            dist-release/out/keysentry.mjs
            dist-release/out/release-manifest.json
            dist-release/out/SHA256SUMS
            dist-release/out/*.tgz

  packed-bin:
    name: Packed npm bin on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts
      - run: npm run release:build
      - name: Exercise global and local npm bin links
        shell: bash
        run: |
          tarballs=("$GITHUB_WORKSPACE"/dist-release/out/*.tgz)
          test "${#tarballs[@]}" -eq 1
          version="$(node -p 'require("./package.json").version')"
          prefix="$(mktemp -d)"
          project="$(mktemp -d)"
          npm install --global --prefix "$prefix" --ignore-scripts --offline "${tarballs[0]}"
          export PATH="$prefix/bin:$PATH"
          test "$(keysentry --version)" = "$version"
          keysentry --help > "$prefix/help.txt"
          grep -q 'Usage: keysentry' "$prefix/help.txt"
          cd "$project"
          npm init --yes
          npm install --ignore-scripts --offline "${tarballs[0]}"
          test "$(npx --no-install keysentry --version)" = "$version"
