# Credentials belong in the vault, never in this file.
# Run keysentry vault import-env or keysentry vault set <NAME>.
# Existing environment credentials remain a fallback.
# Environment scope settings override matching YAML settings.
hosts:
  railway:
    enabled: true
    # projectIds: [project-id]
    # tokenType: project
  vercel:
    enabled: true
    targets: [production, preview]
    # teamId: team-id
  render:
    enabled: true
  fly:
    enabled: true
    # Supply FLY_ORG or configure app names:
    # apps: [example-app]
  github:
    enabled: true
    repos: [] # owner/repo for repository Actions secrets
  dotenv:
    enabled: true
    roots: [.] # resolved from --cwd
    # Sandbox grants these roots read access only. Dotenv updates need explicit
    # KEYSENTRY_NO_SANDBOX=1 when outside .keysentry/ and the user data directory.
    includeTemplates: false

network:
  # Exact additional HTTPS hostnames you approve (no paths, wildcards or IPs).
  # Custom Supabase domains belong here; ordinary *.supabase.co is built in.
  allowHosts: []
  # allowHosts: [database.example.com]

rotation:
  graceSeconds: 120 # 0 disables grace; undo needs a readable, still-valid old key
  revoke: after-deploy
  redeploy: true
  revokeUnconfirmed: false # --revoke-unconfirmed accepts unconfirmed activation
  acceptUnplannedSealed: false # --accept-unplanned-sealed accepts unknown sealed copies
  allowGenerate: true # --no-generate skips self-issued secret generation
  verifyRetries: 4
  deployTimeoutMs: 600000
  pollIntervalMs: 5000

# Non-secret defaults for locally signed armed plans.
# A recent drill and keysentry arm are still required to authorize autopilot.
autopilot:
  graceMinutes: 15
  maxServices: 10
  showHints: false
  healthChecks: []
  # healthChecks:
  #   - serviceKey: railway:project-id/environment-id/service-id
  #     url: https://app.example.com/health
  #     expectStatus: 200

# Add channels through keysentry notify add <kind>.
# Only non-secret settings belong here. Tokens, webhook URLs, SMTP passwords
# and ntfy/relay topics go in vault entries notify/<channelId>/<field>.
notify:
  channels:
    - id: console
      kind: console
    # - id: phone
    #   kind: ntfy
    #   server: https://ntfy.sh
    # - id: email
    #   kind: resend
    #   from: keysentry@example.com
    #   to: [operator@example.com]

monitor:
  interval: 300 # seconds
  autoExecute: false # automatic actions require human terminal startup when enabled
  autoContain: false # cap/disable requires approval; env: KEYSENTRY_AUTO_CONTAIN
  containCooldownMinutes: 60
  # High-confidence canary/leak/upstream revocation may revoke an exposed old key
  # before manual restart / next deployment is confirmed. This can break consumers.
  # Env override: KEYSENTRY_REVOKE_UNCONFIRMED_ON_HIGH_CONFIDENCE=true|false
  revokeUnconfirmedOnHighConfidence: true
  cooldownMinutes: 60
  maxAutoRotationsPerDay: 10 # clusters, per UTC day
  usage:
    floorUsd: 2
    hourlyBudgets: {} # cluster ID or provider:keyRef => hourly USD limit
  rules:
    canary_triggered:
      action: rotate
      scope: service
      minConfidence: medium
    leak_detected:
      action: rotate
      scope: cluster
      minConfidence: high
    revoked_upstream:
      action: rotate
      scope: cluster
      minConfidence: high
    # Cap/disable requires approval unless autoContain is explicitly enabled.
    usage_anomaly:
      action: cap
      scope: cluster
      minConfidence: medium
    host_breach_advisory:
      action: alert
      scope: host
      minConfidence: medium
  # Uncomment to disable external advisory RSS/Atom polling:
  # feeds: []
  # Enable GitHub secret-scanning monitoring with explicit alert repositories:
  # github:
  #   repos: [owner/repo]
  # Supply webhook credentials via KEYSENTRY_WEBHOOK_URL.
