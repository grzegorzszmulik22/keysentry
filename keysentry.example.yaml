# Credentials belong in environment variables, never in this file.
# Environment scope settings override matching YAML settings.
hosts:
  railway:
    enabled: true
    # projectIds: [project-id]
    # tokenType: project
  vercel:
    enabled: true
    targets: [production, preview]
    # teamId: team-id
  render:
    enabled: true
  fly:
    enabled: true
    # Supply FLY_ORG or configure app names:
    # apps: [example-app]
  github:
    enabled: true
    repos: [] # owner/repo for repository Actions secrets
  dotenv:
    enabled: true
    roots: [.] # resolved from --cwd
    includeTemplates: false

rotation:
  revoke: after-deploy
  redeploy: true
  revokeUnconfirmed: false # --revoke-unconfirmed accepts unconfirmed activation
  acceptUnplannedSealed: false # --accept-unplanned-sealed accepts unknown sealed copies
  allowGenerate: true # --no-generate skips self-issued secret generation
  verifyRetries: 4
  deployTimeoutMs: 600000
  pollIntervalMs: 5000

monitor:
  interval: 300 # seconds
  autoExecute: false # rotations require approval unless explicitly enabled
  autoContain: false # cap/disable requires approval; env: KEYSENTRY_AUTO_CONTAIN
  containCooldownMinutes: 60
  # High-confidence canary/leak/upstream revocation may kill a compromised old key
  # before manual restart / next deployment is confirmed. This can break consumers.
  # Env override: KEYSENTRY_REVOKE_UNCONFIRMED_ON_HIGH_CONFIDENCE=true|false
  revokeUnconfirmedOnHighConfidence: true
  cooldownMinutes: 60
  maxAutoRotationsPerDay: 10 # clusters, per UTC day
  usage:
    floorUsd: 2
    hourlyBudgets: {} # cluster ID or provider:keyRef => hourly USD limit
  rules:
    canary_triggered:
      action: rotate
      scope: service
      minConfidence: medium
    leak_detected:
      action: rotate
      scope: cluster
      minConfidence: high
    revoked_upstream:
      action: rotate
      scope: cluster
      minConfidence: high
    # Cap/disable requires approval unless autoContain is explicitly enabled.
    usage_anomaly:
      action: cap
      scope: cluster
      minConfidence: medium
    host_breach_advisory:
      action: alert
      scope: host
      minConfidence: medium
  # Uncomment to disable external advisory RSS/Atom polling:
  # feeds: []
  # Enable GitHub secret-scanning monitoring with explicit alert repositories:
  # github:
  #   repos: [owner/repo]
  # Supply webhook credentials via KEYSENTRY_WEBHOOK_URL.
