services:
  watcher:
    # After the first release, replace this tag with ghcr.io/grzegorzszmulik22/keysentry@sha256:<release-digest>.
    image: ghcr.io/grzegorzszmulik22/keysentry:1.0.0
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    # Supply all five setup values in the private .env file:
    # KEYSENTRY_WATCHER_CONFIG, KEYSENTRY_WATCHER_KEY, KEYSENTRY_STATE_KEY,
    # KEYSENTRY_VAULT_PASSPHRASE, KEYSENTRY_WATCHER_VAULT.
    env_file: [.env]
    environment:
      KEYSENTRY_STATE_DIR: /data
      KEYSENTRY_VAULT: encrypted-file
      NODE_ENV: production
    volumes: ["keysentry-data:/data"]
    tmpfs: ["/tmp"]
volumes:
  keysentry-data: {}
